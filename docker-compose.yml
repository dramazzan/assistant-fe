services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: https://assistant-be-qzoj.onrender.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
